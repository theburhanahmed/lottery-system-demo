name: lottery-system
region: nyc

# Backend Django API Service
services:
  - name: backend
    source_dir: backend
    github:
      repo: your-username/lottery-system-demo  # Update with your GitHub repo
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health/
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DEBUG
        value: "False"
        scope: RUN_TIME
      - key: SECRET_KEY
        value: ${SECRET_KEY}
        scope: RUN_TIME
        type: SECRET
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
        scope: RUN_TIME
      - key: DB_NAME
        value: ${db.DATABASE_NAME}
        scope: RUN_TIME
      - key: DB_USER
        value: ${db.DATABASE_USER}
        scope: RUN_TIME
      - key: DB_PASSWORD
        value: ${db.DATABASE_PASSWORD}
        scope: RUN_TIME
        type: SECRET
      - key: DB_HOST
        value: ${db.DATABASE_HOST}
        scope: RUN_TIME
      - key: DB_PORT
        value: ${db.DATABASE_PORT}
        scope: RUN_TIME
      - key: CORS_ALLOWED_ORIGINS
        value: ${APP_URL},${frontend.PUBLIC_URL}
        scope: RUN_TIME
      # DigitalOcean Spaces (S3-compatible) Storage Configuration
      - key: USE_S3_STORAGE
        value: "True"
        scope: RUN_TIME
      - key: AWS_ACCESS_KEY_ID
        value: ${AWS_ACCESS_KEY_ID}
        scope: RUN_TIME
        type: SECRET
      - key: AWS_SECRET_ACCESS_KEY
        value: ${AWS_SECRET_ACCESS_KEY}
        scope: RUN_TIME
        type: SECRET
      - key: AWS_STORAGE_BUCKET_NAME
        value: ${AWS_STORAGE_BUCKET_NAME}
        scope: RUN_TIME
      - key: AWS_S3_ENDPOINT_URL
        value: ${AWS_S3_ENDPOINT_URL}
        scope: RUN_TIME
        # Example: https://nyc3.digitaloceanspaces.com
      - key: AWS_S3_REGION_NAME
        value: ${AWS_S3_REGION_NAME}
        scope: RUN_TIME
        # Example: nyc3
      - key: AWS_S3_CUSTOM_DOMAIN
        value: ${AWS_S3_CUSTOM_DOMAIN}
        scope: RUN_TIME
        # Optional: Custom CDN domain for Spaces
    routes:
      - path: /api

# Frontend React Static Site
static_sites:
  - name: frontend
    source_dir: frontend-react
    github:
      repo: your-username/lottery-system-demo  # Update with your GitHub repo
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    error_document: index.html
    catchall_document: index.html
    envs:
      - key: VITE_API_BASE_URL
        value: ${backend.PUBLIC_URL}/api
        scope: BUILD_TIME
      - key: VITE_STRIPE_PUBLIC_KEY
        value: ${STRIPE_PUBLIC_KEY}
        scope: BUILD_TIME
        type: SECRET
    routes:
      - path: /

# PostgreSQL Database
databases:
  - name: db
    engine: PG
    version: "15"
    production: false
    cluster_name: lottery-db-cluster
    db_name: lottery_db
    db_user: lottery_user
