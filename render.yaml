# Render: backend + PostgreSQL only. Frontend is deployed on Vercel.
# In Render Dashboard: New → Blueprint → connect this repo → Apply.
# After first sync: in backend Environment, set DATABASE_URL from the db service (Internal Database URL).

databases:
  - name: db
    plan: free
    region: oregon
    postgresMajorVersion: "15"
    databaseName: lottery_db
    user: lottery_user

services:
  - type: web
    name: backend
    runtime: docker
    region: oregon
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health/
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # After first deploy: copy "Internal Database URL" from db → paste as DATABASE_URL on backend.
      # Set CORS_ALLOWED_ORIGINS to your Vercel URL. Optional: STRIPE_* etc.
